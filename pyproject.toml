[project]
name = "calibration"
version = "0.1.0"
description = "Calibration of LLMs from the perspective of interpretability"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Anonymous" },
]
requires-python = ">=3.10"
dependencies = [
  "inteprelens==0.1.0",
  "datasets>=2.20.0",
  "pandas>=2.0.0",
  "pyarrow>=12.0.0",
  "python-dotenv>=1.0.1",
  "torch>=2.0.0",
  "tqdm>=4.66.0",
  "transformers>=4.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibration"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/pyproject.toml",
  "/.env.example",
  "/Makefile",
]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "ipykernel>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["calibration"]
